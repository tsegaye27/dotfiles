##### PREFIX #####
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

##### GENERAL #####
set -g mouse on
set -g set-clipboard on
set -g history-limit 10000

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

bind r source-file ~/.tmux.conf \; display "Tmux config reloaded!"

##### PANES #####
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 5

##### LOOK & FEEL (Tokyo Night) #####
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
setw -g automatic-rename on
set -g set-titles on
set -g display-time 1500

set -g status-position top
set -g status 2                 # 2-line bar: 2nd line empty = gap below bar
set -g "status-format[1]" ""
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#a9b1d6,bg=default,none"
set -g message-style "fg=#7aa2f7,bg=#1f2335,none"
set -g message-command-style "fg=#e0af68,bg=#1f2335,none"
setw -g mode-style "fg=#16161e,bg=#e0af68,bold"
setw -g clock-mode-colour "#7aa2f7"

set -g pane-border-lines heavy
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-status off

# left: session (turns orange while prefix held)
set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7,bg=default]#{?client_prefix,#[fg=#ff9e64],}#[fg=#16161e,bg=#7aa2f7,bold]#{?client_prefix,#[bg=#ff9e64],} #S #[fg=#7aa2f7,bg=default,none]#{?client_prefix,#[fg=#ff9e64],}  "

# windows: index + name, Z when zoomed
setw -g window-status-separator ""
setw -g window-status-style "none"
setw -g window-status-current-style "none"  # tmux 3.8 default is underscore
setw -g window-status-last-style "none"
setw -g window-status-format "#[fg=#292e42,bg=default]#[fg=#565f89,bg=#292e42] #I #[fg=#a9b1d6]#W#{?window_zoomed_flag, 󰊓,} #[fg=#292e42,bg=default] "
setw -g window-status-current-format "#[fg=#bb9af7,bg=default]#[fg=#16161e,bg=#bb9af7,bold]#I #[fg=#c0caf5,bg=#3b4261] #W#{?window_zoomed_flag, 󰊓,} #[fg=#3b4261,bg=default,none] "
setw -g window-status-activity-style "fg=#e0af68,bg=default,none"
setw -g window-status-bell-style "fg=#f7768e,bg=default,bold"

# right: mem, cpu, date/time, host
set -g status-right-length 100
set -g status-right "#[fg=#565f89,none] MEM #[fg=#9ece6a]#(~/.tmux-mem.sh) #[fg=#565f89]CPU #[fg=#e0af68]#(~/.tmux-cpu.sh) #[fg=#565f89]│ #[fg=#7dcfff]%a %d %b #[fg=#c0caf5,bold]%H:%M #[fg=#9ece6a,bg=default]#[fg=#16161e,bg=#9ece6a,bold]󰒋 #h#[fg=#9ece6a,bg=default,none]"

##### POPUPS #####
# tmux 3.8 default popup bg is themedarkgrey; keep popups transparent
set -g popup-style "fg=#a9b1d6,bg=default"
set -g popup-border-style "fg=#7aa2f7,bg=default"
set -g popup-border-lines rounded

##### SESSIONS (sesh) #####
# prefix+s: fuzzy-pick tmux session, zoxide dir, or config; ^a all ^t tmux ^x zoxide ^d kill
set -g detach-on-destroy off
bind s run-shell "sesh connect \"$(
  sesh list --icons | fzf --tmux center,60%,60% --layout reverse --border rounded --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ' \
    --header '^a all  ^t tmux  ^x zoxide  ^d kill' \
    --color 'bg:-1,bg+:#292e42,fg:#a9b1d6,fg+:#c0caf5,hl:#7aa2f7,hl+:#7dcfff,border:#7aa2f7,label:#bb9af7,prompt:#bb9af7,pointer:#ff9e64,header:#565f89' \
    --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
    --bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z --icons)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡ )+reload(sesh list --icons)'
)\""

##### COPY MODE #####
setw -g mode-keys vi
bind -T copy-mode-vi v    send -X begin-selection
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

##### PLUGINS #####
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
