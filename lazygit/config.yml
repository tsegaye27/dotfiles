customCommands:
  - key: "<c-x>"
    context: "files"
    description: "Generate commit message with Claude Code"
    command: >-
      f=$(mktemp) &&
      git diff --staged --quiet && { echo "Nothing staged"; sleep 1; exit 1; };
      git diff --staged -- . ':!*.lock' ':!package-lock.json' ':!go.sum' |
      /Users/apple/.local/bin/claude -p 'Generate a concise git commit message for these staged changes. Output ONLY the raw commit message with no markdown, no code blocks, no backticks, no explanations, no trailer. Use conventional commit format.' --model haiku --output-format text > "$f" &&
      GIT_EDITOR=vim git commit -e -F "$f"
    output: terminal
